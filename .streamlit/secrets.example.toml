# 範例檔：請至 Streamlit Cloud → 您的 App → Settings → Secrets，貼上下列內容並改成您自己的密碼。
# （此檔僅為範本，請勿在這裡填入真正的密碼，也不要把真正的 secrets.toml 上傳到 GitHub）

# 業務科（民力及訓練科）密碼：可檢視/管理全部案件、可刪除任何案件、可設定 API Key 與雲端試算表
HQ_PASSWORD = "請改成業務科密碼"

# 各大隊密碼：各大隊只看得到、也只能管理（複核、刪除）自己大隊的案件
# 設定後，舊版共用密碼會自動失效
[UNIT_PASSWORDS]
"臺東大隊" = "請改成臺東大隊密碼"
"關山大隊" = "請改成關山大隊密碼"
"成功大隊" = "請改成成功大隊密碼"
"大武大隊" = "請改成大武大隊密碼"
